# Copy to ~/.config/yabai_controls/config.toml
#
# Chord syntax: "mod + mod - key" or a bare "key" (see src/keys/keycodes.rs
# for key names). Modifiers: cmd, alt, ctrl, shift, fn.
#
# Action forms:
#   "chord" = "space --focus 1"            # string  -> yabai -m <args>
#   "chord" = { yabai = "window --toggle float" }
#   "chord" = { shell = "open -n -a Ghostty" }
#   "chord" = { mode = "resize" }          # switch hotkey mode
#   "chord" = { focus = "previous-window" }  # jump back to the last focused
#                                          #   window/space (press twice to toggle):
#                                          #   previous-window | previous-space
#   "chord" = { focus = "clockwise" }      # cycle windows on the focused space
#                                          #   clockwise | counter-clockwise
#   "chord" = { app = "Google Chrome" }    # focus the app wherever its window is;
#                                          #   press again to cycle its windows
#   "chord" = { app = "Ghostty", launch = true }  # ... or `open -a` it if it has none

[settings]
# shell = "/bin/zsh"                       # used for `shell` actions; defaults to $SHELL

[bindings]
# focus spaces
"alt - 1" = "space --focus 1"
"alt - 2" = "space --focus 2"
"alt - 3" = "space --focus 3"
"alt - 4" = "space --focus 4"
"alt - 5" = "space --focus 5"

# move the focused window to a space and follow it
"alt + shift - 1" = "window --space 1 --focus"
"alt + shift - 2" = "window --space 2 --focus"
"alt + shift - 3" = "window --space 3 --focus"

# focus windows
"alt - h" = "window --focus west"
"alt - j" = "window --focus south"
"alt - k" = "window --focus north"
"alt - l" = "window --focus east"

# layout
"alt - w" = "window --toggle float"
"alt - f" = "window --toggle zoom-fullscreen"
"alt - s" = "space --layout stack"
"alt - b" = "space --layout bsp"
"alt - t" = "space --focus teams"

# jump back to the previously focused window / space (press again to return)
"alt - tab" = { focus = "previous-window" }
"alt - escape" = { focus = "previous-space" }

# cycle through the windows on the focused space, works in any layout
"alt - n" = { focus = "clockwise" }
"alt - p" = { focus = "counter-clockwise" }

# apps: jump to an app wherever it is (repeat to cycle its windows)
"alt - c" = { app = "Google Chrome" }
"alt - return" = { app = "Ghostty", launch = true }
"alt + shift - return" = { shell = "open -n -a Ghostty" }   # always a new window

# enter resize mode
"alt - r" = { mode = "resize" }

[modes.resize]
"h" = "window --resize left:-40:0"
"j" = "window --resize bottom:0:40"
"k" = "window --resize top:0:-40"
"l" = "window --resize right:40:0"
"escape" = { mode = "default" }
"return" = { mode = "default" }

# Dedicate spaces to apps. Keyed by space index; missing spaces are created
# when yabai's scripting addition is loaded, otherwise skipped with a warning.
# `app` is the exact name yabai reports
# (see `yabai_controls state`). `label` defaults to `app`. `follow = true`
# focuses the space when a new window of the app appears. Labels persist in
# yabai after the daemon exits; rules are removed.
[spaces]
1 = { app = "Google Chrome" }                        # label defaults to the app name
2 = { app = "Microsoft Teams", label = "teams" }     # override the label
3 = { app = "Ghostty", follow = true }               # focus the space when a window appears
4 = { label = "scratch" }                            # label only, no dedicated app
