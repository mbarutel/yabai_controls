[package]
name = "yabai_controls"
version = "0.1.0"
edition = "2024"

[dependencies]
# Keyboard capture: CGEventTap + CFRunLoop on the main thread.
core-foundation = "0.10"
core-graphics = "0.25"

# CLI parsing.
clap = { version = "4.6", features = ["derive"] }

# Config file and yabai JSON replies.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

# Errors and logging.
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
signal-hook = "0.4"

[dev-dependencies]
tempfile = "3"
